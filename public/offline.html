<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroWerk - Offline</title>
    <style>
        :root {
            --accent: #00843D;
            --bg: #f5f7f2;
            --text: #0f172a;
            --muted: #475569;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 20% 20%, rgba(0, 132, 61, 0.08), transparent 35%),
                        radial-gradient(circle at 80% 0%, rgba(0, 132, 61, 0.08), transparent 25%),
                        var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        main {
            width: min(420px, 100%);
            background: #ffffff;
            border-radius: 16px;
            padding: 28px 24px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(0, 132, 61, 0.1);
            color: var(--accent);
            font-weight: 600;
            font-size: 13px;
        }

        h1 {
            margin: 16px 0 8px;
            font-size: 24px;
            line-height: 1.2;
        }

        p {
            margin: 0 0 20px;
            color: var(--muted);
            line-height: 1.5;
        }

        button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 132, 61, 0.2);
            transition: transform 150ms ease, box-shadow 150ms ease, background-color 150ms ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 40px rgba(0, 132, 61, 0.25);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 10px 30px rgba(0, 132, 61, 0.2);
        }

        .hint {
            margin-top: 12px;
            font-size: 13px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main>
        <div class="status">
            ● Sem conexão
        </div>
        <h1>Você está offline</h1>
        <p>O aplicativo continua funcionando com o que já está salvo. Reconecte-se para receber as atualizações mais recentes.</p>
        <button type="button" onclick="location.reload()">Tentar novamente</button>
        <div class="hint">Se o problema continuar, verifique sua conexão ou tente mais tarde.</div>
    </main>
</body>
</html>
